apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{.Values.keyVault.secretProviderClassName}}
  labels: {{- include "workshop-app.labels" . | nindent 4}}
spec:
  provider: azure
  secretObjects:
    - secretName: {{include "workshop-app.secretName" .}}
      type: Opaque
      data:
        - key: ConnectionStrings__ReadModel
          objectName: {{.Values.keyVault.secrets.readModelConnectionString}}
        - key: Messaging__EventHubs__ConnectionString
          objectName: {{.Values.keyVault.secrets.eventHubsConnectionString}}
        - key: Messaging__EventHubs__CheckpointBlobConnectionString
          objectName: {{.Values.keyVault.secrets.checkpointStorageConnectionString}}
        - key: Messaging__AzureServiceBus__ConnectionString
          objectName: {{.Values.keyVault.secrets.serviceBusConnectionString}}
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: {{.Values.keyVault.managedIdentityClientId | quote}}
    keyvaultName: {{.Values.keyVault.name | quote}}
    tenantId: {{.Values.keyVault.tenantId | quote}}
    objects: |
      array:
        - |
          objectName: {{ .Values.keyVault.secrets.readModelConnectionString }}
          objectType: secret
        - |
          objectName: {{ .Values.keyVault.secrets.eventHubsConnectionString }}
          objectType: secret
        - |
          objectName: {{ .Values.keyVault.secrets.checkpointStorageConnectionString }}
          objectType: secret
        - |
          objectName: {{ .Values.keyVault.secrets.serviceBusConnectionString }}
          objectType: secret
