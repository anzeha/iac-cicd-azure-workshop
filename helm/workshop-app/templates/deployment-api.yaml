apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "workshop-app.fullname" . }}-api
  labels:
    {{- include "workshop-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "workshop-app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "workshop-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "workshop-app.fullname" . }}
      containers:
        - name: api
          image: "{{.Values.global.dockerRegistry}}/{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.containerPort }}
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "workshop-app.fullname" . }}-config
          env:
            - name: ConnectionStrings__ReadModel
              valueFrom:
                secretKeyRef:
                  name: {{ include "workshop-app.secretName" . }}
                  key: ConnectionStrings__ReadModel
            - name: Messaging__EventHubs__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: {{ include "workshop-app.secretName" . }}
                  key: Messaging__EventHubs__ConnectionString
            - name: Messaging__EventHubs__CheckpointBlobConnectionString
              valueFrom:
                secretKeyRef:
                  name: {{ include "workshop-app.secretName" . }}
                  key: Messaging__EventHubs__CheckpointBlobConnectionString
            - name: Messaging__AzureServiceBus__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: {{ include "workshop-app.secretName" . }}
                  key: Messaging__AzureServiceBus__ConnectionString
            - name: ASPNETCORE_URLS
              value: http://+:{{ .Values.api.containerPort }}
          volumeMounts:
            - name: secrets-store-inline
              mountPath: /mnt/secrets-store
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Values.keyVault.secretProviderClassName }}
