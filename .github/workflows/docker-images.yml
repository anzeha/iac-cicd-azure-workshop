name: Docker Image Build

on:
  workflow_call:
    inputs:
      push-images:
        description: Push images to Docker Hub after build and scan.
        required: true
        type: boolean
    secrets:
      DOCKERHUB_TOKEN:
        required: false

jobs:
  docker:
    name: ${{ matrix.image.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        image:
          - name: workshop-api
            dockerfile: Nlb.Workshop.Api/Dockerfile
          - name: workshop-consumer
            dockerfile: Nlb.Workshop.Consumer.Worker/Dockerfile

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          load: true
          push: false
          tags: ${{ matrix.image.name }}:${{ github.sha }}

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.image.name }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Login to Docker Hub
        if: inputs.push-images
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: inputs.push-images
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image.name }}:${{ github.sha }}
