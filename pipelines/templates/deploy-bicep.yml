parameters:
  - name: environmentName
    type: string
  - name: artifactRoot
    type: string

steps:
  - task: AzureCLI@2
    displayName: Resolve existing infrastructure outputs (${{ parameters.environmentName }})
    inputs:
      azureSubscription: $(azureRmServiceConnection)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail

        RESOURCE_GROUP="$(workloadName)-${{ parameters.environmentName }}-rg"
        ARTIFACT_ROOT="${{ parameters.artifactRoot }}"
        OUTPUT_FILE="$ARTIFACT_ROOT/infra-outputs-${{ parameters.environmentName }}.json"

        ACR_NAME=$(az acr list --resource-group "$RESOURCE_GROUP" --query '[0].name' -o tsv)
        ACR_LOGIN_SERVER=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
        AKS_NAME=$(az aks list --resource-group "$RESOURCE_GROUP" --query '[0].name' -o tsv)
        EVENT_HUB_NAMESPACE_NAME=$(az eventhubs namespace list --resource-group "$RESOURCE_GROUP" --query '[0].name' -o tsv)
        KEY_VAULT_NAME=$(az keyvault list --resource-group "$RESOURCE_GROUP" --query '[0].name' -o tsv)
        WORKLOAD_IDENTITY_NAME="$(workloadName)-${{ parameters.environmentName }}-workload-id"
        WORKLOAD_IDENTITY_CLIENT_ID=$(az identity show --resource-group "$RESOURCE_GROUP" --name "$WORKLOAD_IDENTITY_NAME" --query clientId -o tsv)

        python3 - <<PY
        import json
        path = "$OUTPUT_FILE"
        data = {
            "acrName": {"value": "$ACR_NAME"},
            "acrLoginServer": {"value": "$ACR_LOGIN_SERVER"},
            "aksClusterName": {"value": "$AKS_NAME"},
            "eventHubNamespaceName": {"value": "$EVENT_HUB_NAMESPACE_NAME"},
            "keyVaultName": {"value": "$KEY_VAULT_NAME"},
            "managedIdentityClientId": {"value": "$WORKLOAD_IDENTITY_CLIENT_ID"},
        }
        with open(path, "w", encoding="utf-8") as f:
            json.dump(data, f)
        PY
