steps:
  - task: UseDotNet@2
    displayName: Use .NET SDK 10
    inputs:
      packageType: sdk
      version: 10.0.x

  - script: |
      dotnet restore nlb-workshop-azure.slnx --nologo
    displayName: Restore solution

  - script: dotnet build nlb-workshop-azure.slnx --configuration $(buildConfiguration) --no-restore --nologo
    displayName: Build solution

  - script: |
      version=$(cat $(Build.SourcesDirectory)/Nlb.Workshop.Api/Nlb.Workshop.Api.csproj | grep '<Version>' | sed "s@.*<Version>\(.*\)</Version>.*@\1@")
      echo "Version: $version"
      echo "##vso[task.setvariable variable=version;isOutput=true]$version"
    name: ReadProjectVersion
    displayName: Read project version from csproj file
